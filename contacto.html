<h2>Página de contactos</h2>
<p>Página de contactos</p>

<div class="contenedor">
    <div class="columna">
        <form action="" method="post" enctype="multipart/form-data">
    <label for="nombre">Nombre</label>
    <input type="text" id="nombre" name="nombre" required><br><br>
    <label for="tipo">Tipo de solicitud:</label>
    <select name="tipo" id="tipo">
        <option value="Soporte">Soporte</option>
        <option value="Ventas">Ventas</option>
        <option value="Cotización">Cotizaciones</option>
    </select><br><br>

    <label for="correo">Correo Electrónico</label>
    <input type="email" id="email" name="email" required><br><br>

    <label for="archivo">Subir un archivo:</label>
    <input type="file" id="archivo" name="archivo"required>
     <br><br>

     <label for="descripcion">Descripción:</label>
     <textarea name="desc" id="desc" rows="5" cols="33"></textarea>
     <br>
     <input type="submit" value="Enviar solicitud"><br><br><br>
</form>
